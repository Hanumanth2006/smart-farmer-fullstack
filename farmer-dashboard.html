<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Farmer Dashboard - Smart Farmer</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">

            <div class="logo">
                🌾 Smart Farmer
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="crops.html">Crops</a></li>
                <li><a href="farmer-dashboard.html">Dashboard</a></li>
            </ul>

            <div class="nav-buttons">
              <a href="#" class="login-btn" onclick="logoutUser()">Logout</a>  
            </div>

        </nav>
    </header>

    <!-- Add Crop -->
    <section class="add-crop-section">

        <div class="dashboard-title">

            <h2>My Crops</h2>

            <button
                class="add-crop-btn"
                onclick="showCropForm()"
            >
                + Add New Crop
            </button>

        </div>


        <!-- Add Crop Form -->
        <div
            id="cropForm"
            class="crop-form"
            style="display: none;"
        >

            <h3>Add New Crop</h3>

            <input
                type="text"
                id="newCropName"
                placeholder="Crop name"
            >

            <input
                type="number"
                id="newCropPrice"
                placeholder="Price per Quintal"
            >

            <input
                type="number"
                id="newCropQuantity"
                placeholder="Available quantity"
            >

            <select id="newCropCategory">

                <option value="">
                    Select Category
                </option>

                <option value="grains">
                    Grains
                </option>

                <option value="vegetables">
                    Vegetables
                </option>

                <option value="fruits">
                    Fruits
                </option>

                <option value="spices">
                    Spices
                </option>

            </select>

            <button
                class="save-crop-btn"
                onclick="addFarmerCrop()"
            >
                Save Crop
            </button>

        </div>


        <!-- Crop Table -->
        <div class="crop-table-container">

            <table class="crop-table">

                <thead>

                    <tr>
                        <th>Crop</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Status</th>
                    </tr>

                </thead>

               <tbody id="farmerCropTable">
    <tr>
        <td colspan="5" style="text-align: center; padding: 30px;">
            🌱 No crops added yet
        </td>
    </tr>
</tbody>


            </table>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <div class="footer-content">

            <h3>🌾 Smart Farmer</h3>

            <p>
                Empowering farmers through digital connections.
            </p>

            <p>
                © 2026 Smart Farmer. All Rights Reserved.
            </p>

        </div>

    </footer>


    <script src="main.js"></script>

</body>

</html>
